[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthetic-data-fix"
version = "0.1.0"
description = "Add standard QC FORMAT fields (GQ, DP, AD) to synthetic and simulated VCF files."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fix-synthetic-data = "fix_synthetic_data:main"

[tool.hatch.build.targets.wheel]
include = ["fix_synthetic_data.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
